name: CleanBreath CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, Lint, Test (>=85% coverage), Build, Secret Scan & Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: TypeScript Strict Check
        run: npm run typecheck

      - name: ESLint (Source, Tests & Firestore Rules)
        run: npm run lint && npx eslint firestore.rules

      - name: Format Check
        run: npm run format:check

      - name: Unit, Integration & Accessibility Tests with Coverage
        run: npm run test:ci

      - name: Upload Coverage Summary Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          if-no-files-found: warn

      - name: Production Build (Client + Server)
        run: npm run build

      - name: Dependency Security Audit
        run: npm audit --audit-level=high

      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Production Docker Image Build
        run: docker build -t cleanbreath:ci .
